name: Build Android APK

# Compila el reproductor Android (venuepro-signage/android) y deja el .apk
# LISTO donde el backend ya lo sirve de verdad (public/downloads/, el
# mismo archivo que instala "APK: https://ds.venueprocrm.cloud/downloads/
# venuepro-signage-test.apk") — así nadie necesita Android Studio para
# tener una build actualizada, ni bajar nada a mano desde Actions.
#
# Usa el build "debug": Gradle lo firma solo con una clave de depuración
# autogenerada (Android exige que todo .apk esté firmado, incluso para
# pruebas) — suficiente para sideload en el Onn activando "orígenes
# desconocidos". No sirve para publicarlo en Play Store (eso necesitaría
# firma de release, con secretos que no existen aquí).
on:
  push:
    branches: [main]
    paths:
      - 'venuepro-signage/android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch: {} # botón "Run workflow" en la pestaña Actions, para compilar bajo demanda

permissions:
  contents: write # para poder commitear el .apk recién compilado de vuelta al repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # El runner de GitHub NO trae sdkmanager en el PATH por defecto (el
      # SDK preinstalado varía por imagen) — esta acción sí lo deja listo
      # y acepta las licencias sola. Falló varias veces seguidas el
      # 2026-09-14 (~21:03-21:07 UTC), incluso en runners nuevos recién
      # levantados — así que reintentar DENTRO del mismo job (como se
      # probó primero) no ayuda, es algo externo (descarga de Google o el
      # propio runner) que necesita que pase el tiempo, no más intentos
      # seguidos en la misma corrida.
      - name: Configurar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma y build-tools de Android (compileSdk 35)
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cachear Gradle (usa el wrapper del repo, ./gradlew)
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de depuración
        id: build
        working-directory: venuepro-signage/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/gradle-build.log 2>&1
        continue-on-error: true

      # Si falla, el log completo vive en el storage de logs de Actions (a
      # veces no accesible desde entornos con salida de red restringida) —
      # esto vuelca la cola como anotaciones del check, que sí se leen por
      # la API normal de GitHub sin pasar por ese storage.
      - name: Mostrar el error de compilación como anotaciones (si falló)
        if: steps.build.outcome == 'failure'
        run: |
          echo "::group::Cola del log de Gradle"
          tail -n 200 /tmp/gradle-build.log
          echo "::endgroup::"
          # La cola cruda suele ser puro stack trace interno de Gradle, no
          # el mensaje real — busca la sección "What went wrong" (o
          # "FAILURE:") y manda ESO como anotación en vez de las últimas
          # líneas a ciegas.
          section=$(awk '/^\* What went wrong:/{f=1} f' /tmp/gradle-build.log | head -n 100)
          [ -n "$section" ] || section=$(grep -A 100 '^FAILURE:' /tmp/gradle-build.log | head -n 100)
          [ -n "$section" ] || section=$(tail -n 60 /tmp/gradle-build.log)
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error::$esc"
          done <<< "$section"
          exit 1

      - name: Publicar el APK donde el backend lo sirve y refrescar SHA256SUMS
        run: |
          cp venuepro-signage/android/app/build/outputs/apk/debug/app-debug.apk venuepro-signage/public/downloads/venuepro-signage-test.apk
          node venuepro-signage/scripts/package.mjs

      - name: Commitear el APK actualizado (solo si cambió)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add venuepro-signage/public/downloads/venuepro-signage-test.apk venuepro-signage/SHA256SUMS
          git diff --cached --quiet && echo "Sin cambios en el APK, nada que commitear." || git commit -m "Actualizar APK de depuración compilada [skip ci]"
          git push

      - name: Respaldo también como artifact descargable (30 días)
        uses: actions/upload-artifact@v4
        with:
          name: venuepro-signage-debug-${{ github.run_number }}
          path: venuepro-signage/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
