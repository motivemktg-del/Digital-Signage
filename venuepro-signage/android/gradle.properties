# Sin android.useAndroidX=true, Gradle rechaza cualquier dependencia
# AndroidX (media3/ExoPlayer lo es) con "Execution failed for task
# ':app:checkDebugAarMetadata'". No existía este archivo — hasta la
# primera dependencia externa del proyecto (media3, para RTSP) no hacía
# falta.
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
