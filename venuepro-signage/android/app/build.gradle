plugins { id 'com.android.application' }
android {
 namespace 'cloud.venueprocrm.signage'
 compileSdk 35
 defaultConfig { applicationId 'cloud.venueprocrm.signage'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.3.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
// ExoPlayer+RTSP: reproduce la señal en vivo casi en tiempo real (sin el
// buffer de varios segundos del MP4 progresivo que usa el proxy del panel
// web) — server.js manda liveSourceRtsp en el manifiesto cuando puede
// derivarla.
//
// stream-webrtc-android: WebRTC de verdad (recompilación mantenida de la
// librería oficial de Google, mismo paquete org.webrtc que usan todos los
// ejemplos). Se prioriza SOBRE RTSP cuando el manifiesto trae
// liveSourceWebrtc — a diferencia de RTSP, WebRTC puede pedirle un
// keyframe al encoder AL CONECTARSE (en vez de esperar el próximo
// programado), que es justo el techo de latencia que RTSP no puede
// bajar más (issue conocido y sin resolver de ExoPlayer/media3: ver
// https://github.com/androidx/media/issues/1179). Si WebRTC no logra
// conectar (ICE falla, no hay ruta a esa LAN, etc.) cae solo a RTSP.
dependencies {
 implementation 'androidx.media3:media3-exoplayer:1.4.1'
 implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
 implementation 'io.getstream:stream-webrtc-android:1.3.10'
}
