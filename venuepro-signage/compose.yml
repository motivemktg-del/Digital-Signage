name: venuepro-signage
services:
  signage:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_URL: https://ds.venueprocrm.cloud
      DATA_DIR: /app/data
      STORAGE_MODE: bunny
    volumes:
      - signage_data:/app/data
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?Set the existing Traefik network}
      traefik.http.routers.venuepro-signage.rule: Host(`ds.venueprocrm.cloud`)
      traefik.http.routers.venuepro-signage.entrypoints: websecure
      traefik.http.routers.venuepro-signage.tls: "true"
      traefik.http.routers.venuepro-signage.tls.certresolver: letsencrypt
      traefik.http.services.venuepro-signage.loadbalancer.server.port: "3080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  signage_data:
networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:?Set the existing Traefik network}
