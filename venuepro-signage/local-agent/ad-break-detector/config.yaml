name: "Detector de corte comercial"
version: "0.1.0"
slug: "ad_break_detector"
description: >-
  Mira la señal en vivo de go2rtc, detecta cuando entra un corte comercial
  (heurísticas de imagen — cuadro negro, "bug" del canal ausente, tasa de
  cortes de plano) y activa/quita el Mezclador de tu pantalla en
  venuepro-signage automáticamente. Uso previsto: mostrar TUS PROPIAS
  promos durante el corte, no vender ese espacio a terceros.
url: "https://github.com/motivemktg-del/Digital-Signage"
arch:
  - aarch64
  - amd64
init: false
options:
  go2rtc_url: "http://localhost:1984"
  stream: "mivideo"
  signage_api: ""
  signage_email: ""
  signage_password: ""
  device_id: ""
  promo_asset_id: ""
  promo_logo_asset_id: ""
  promo_text: ""
  promo_layout: "full"
  muted_during_ad: false
  poll_interval_ms: 700
  min_ad_seconds: 3
  min_live_seconds: 3
  black_luma_threshold: 24
  bug_roi: "0.02,0.85,0.18,0.12"
  bug_diff_threshold: 0.35
  cutrate_window_seconds: 4
  cutrate_diff_threshold: 40
  cutrate_cuts_threshold: 3
  votes_needed: 2
schema:
  go2rtc_url: "url"
  stream: "str"
  signage_api: "url"
  signage_email: "email"
  signage_password: "password"
  device_id: "str"
  promo_asset_id: "str"
  promo_logo_asset_id: "str?"
  promo_text: "str"
  promo_layout: "list(lower|split|full)"
  muted_during_ad: "bool"
  poll_interval_ms: "int(200,5000)"
  min_ad_seconds: "float(0,30)"
  min_live_seconds: "float(0,30)"
  black_luma_threshold: "float(0,255)"
  bug_roi: "match(^[0-9.]+,[0-9.]+,[0-9.]+,[0-9.]+$)"
  bug_diff_threshold: "float(0,1)"
  cutrate_window_seconds: "float(1,30)"
  cutrate_diff_threshold: "float(1,255)"
  cutrate_cuts_threshold: "int(1,20)"
  votes_needed: "int(1,3)"
